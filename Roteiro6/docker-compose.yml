services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - SERVICES=s3,sqs,sns,dynamodb
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "./scripts/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - app-network

  storage-service:
    build:
      context: ./services/storage-service
      dockerfile: Dockerfile
    container_name: storage-service
    ports:
      - "50051:50051"
    environment:
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET=shopping-images
    depends_on:
      - localstack
    networks:
      - app-network

  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: task-service
    ports:
      - "50052:50052"
    environment:
      - AWS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE=tasks
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/task-queue
      - SNS_TOPIC_ARN=arn:aws:sns:us-east-1:000000000000:task-notifications
    depends_on:
      - localstack
    networks:
      - app-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      - STORAGE_SERVICE_URL=storage-service:50051
      - TASK_SERVICE_URL=task-service:50052
    depends_on:
      - storage-service
      - task-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
